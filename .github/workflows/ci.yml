name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CGO_ENABLED: 0

jobs:
  test:
    name: test + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test (incl. architecture-enforcement gate)
        # internal/architecturetest walks `go list -deps` and fails the build on
        # any layer-boundary violation — see establish-enforced-go-architecture.
        run: go test -count=1 ./...

  migrations:
    name: migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: spisordning
          POSTGRES_USER: spisordning
          POSTGRES_PASSWORD: change-me
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U spisordning'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: install psql (for migration checks)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: apply migrations in order (must all succeed)
        run: |
          set -euo pipefail
          for f in $(ls migrations/*.sql | sort); do
            echo "=== applying $f ==="
            PGPASSWORD=change-me psql -h localhost -U spisordning -d spisordning \
              -v ON_ERROR_STOP=1 -f "$f"
          done

  persistence-test:
    name: persistence integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: spisordning
          POSTGRES_USER: spisordning
          POSTGRES_PASSWORD: change-me
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U spisordning'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The integration tests (internal/persistence/*_test.go) skip without these;
      # in CI they run against the service container above (task 2.4).
      DATABASE_URL: "postgres://spisordning:change-me@localhost:5432/spisordning?sslmode=disable"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true
      - name: apply migrations in order
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          for f in $(ls migrations/*.sql | sort); do
            PGPASSWORD=change-me psql -h localhost -U spisordning -d spisordning \
              -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: persistence integration tests
        run: go test -count=1 ./internal/persistence/...

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/food-brain:ci
          # food-brain now runs an HTTP server (api/openapi.yaml); this build
          # ensures the multi-stage Dockerfile stays buildable (task 4.1).

   codegen:
     name: openapi codegen up-to-date
     runs-on: ubuntu-latest
     # Fails if api/openapi.yaml drifts from internal/openapi/types.gen.go.
     # Tool: oapi-codegen v2 (see tools/tools.go + Makefile generate target).
     steps:
       - uses: actions/checkout@v4
       - uses: actions/setup-go@v5
         with:
           go-version: '1.26.1'
           cache: true
       - name: regenerate types from spec
         run: go generate ./internal/openapi
       - name: assert no diff (spec ↔ generated types in sync)
         run: git diff --exit-code -- internal/openapi/types.gen.go

   migrations:
