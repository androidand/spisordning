openapi: 3.0.3

info:
  title: Spisordning API
  version: 0.1.0
  description: >
    Household food knowledge service: recipe management with git-like evolution,
    weekly meal planning, recommendations, pantry/inventory, and shopping
    requirements. This is the design-first contract; generated server/client code
    is derived from this file and never hand-edited. Migration owner: the
    `migrations/` directory under the repo root — Directus or any other tool must
    not schema-edit here.

servers:
  - url: http://localhost:8080
    description: local docker-compose stack (`food-brain` service)

# Every schema change is authorized through this single, documented surface.
x-layer-policy:
  domain:        internal/domain
  application:   internal/planning
  service:       internal/service
  persistence:   internal/persistence
  httpapi:       internal/httpapi
  composition:   cmd/food-brain

paths:
  /health:
    get:
      summary: Liveness/ready probe
      operationId: getHealth
      tags: [system]
      responses:
        '200':
          description: service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /people:
    get:
      summary: List household people
      operationId: listPeople
      tags: [people]
      responses:
        '200':
          description: people
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Person' }
    post:
      summary: Create a person
      operationId: createPerson
      tags: [people]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonNew' }
      responses:
        '201':
          description: created
          content:
            application/json: { schema: { $ref: '#/components/schemas/Person' } }

  /people/{personId}:
    parameters:
      - $ref: '#/components/parameters/PersonId'
    get:
      summary: Fetch one person
      operationId: getPerson
      tags: [people]
      responses:
        '200': { description: a person, content: { application/json: { schema: { $ref: '#/components/schemas/Person' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update a person's name and/or weight
      operationId: updatePerson
      tags: [people]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonUpdate' }
      responses:
        '200': { description: updated person, content: { application/json: { schema: { $ref: '#/components/schemas/Person' } } } }
        '400': { description: name missing }
        '404': { $ref: '#/components/responses/NotFound' }

  /preferences:
    get:
      summary: List all preferences
      operationId: listPreferences
      tags: [preferences]
      parameters:
        - name: personId
          in: query
          schema: { type: string }
          description: filter to one person
      responses:
        '200':
          description: preferences
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PersonPreference' }
    post:
      summary: Set (upsert) a person's preference for a tag
      operationId: setPreference
      tags: [preferences]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonPreferenceNew' }
      responses:
        '201':
          description: created or updated preference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonPreference' }
        '400': { description: missing fields or out-of-range sentiment/confidence }

  /recipes:
    get:
      summary: List known recipe refs
      operationId: listRecipes
      tags: [recipes]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RecipeRef' }

  /recipes/{recipeId}:
    parameters:
      - $ref: '#/components/parameters/RecipeId'
    get:
      summary: Fetch one recipe ref
      operationId: getRecipe
      tags: [recipes]
      responses:
        '200': { description: a recipe ref, content: { application/json: { schema: { $ref: '#/components/schemas/RecipeRef' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /meals:
    post:
      summary: Record a served meal (optionally with reactions)
      operationId: createMealEvent
      tags: [meals]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MealEventNew' }
      responses:
        '201': { description: meal event created, content: { application/json: { schema: { $ref: '#/components/schemas/MealEvent' } } } }

  /tonight:
    get:
      summary: Surface tonight's meal from the approved plan
      operationId: getTonight
      tags: [tonight]
      responses:
        '200': { description: tonight's meal, content: { application/json: { schema: { $ref: '#/components/schemas/TonightView' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /reactions:
    post:
      summary: One-tap reaction to tonight's meal (or any meal event)
      operationId: createReaction
      tags: [reactions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReactionNew' }
      responses:
        '201': { description: reaction recorded, content: { application/json: { schema: { $ref: '#/components/schemas/MealReaction' } } } }

  /plans:
    get:
      summary: List meal plans
      operationId: listPlans
      tags: [plans]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MealPlan' }
    post:
      summary: Create a meal plan for a week (status=draft)
      operationId: createPlan
      tags: [plans]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MealPlanNew' }
      responses:
        '201': { description: plan created, content: { application/json: { schema: { $ref: '#/components/schemas/MealPlan' } } } }

  /plans/run:
    post:
      summary: Run the weekly planner (async; returns job id)
      operationId: runPlan
      tags: [plans]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanRunInput' }
      responses:
        '202': { description: plan run accepted, content: { application/json: { schema: { $ref: '#/components/schemas/PlanRunResult' } } } }
        '500': { $ref: '#/components/responses/NotFound' }

  /plans/run/stream:
    post:
      summary: Run the weekly planner, streaming progress as Server-Sent Events
      description: >-
        Runs the plan and streams `text/event-stream` progress events as each
        phase completes (started, planning, resolving, wishlist, done). The
        synchronous POST /plans/run is unaffected — this endpoint is additive.
        The event payload shape is not finalized until the frontend's SSE
        consumer needs it (task 3.4).
      operationId: runPlanStream
      tags: [plans]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanRunInput' }
      responses:
        '200':
          description: progress event stream
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/PlanProgress' }

  /plans/{planId}:
    parameters:
      - $ref: '#/components/parameters/PlanId'
    get:
      summary: Fetch a plan with its ranked candidates
      operationId: getPlan
      tags: [plans]
      responses:
        '200': { description: plan + candidates, content: { application/json: { schema: { $ref: '#/components/schemas/MealPlanView' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update a plan's status (e.g. approve or archive)
      operationId: updatePlan
      tags: [plans]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MealPlanUpdate' } } }
      responses:
        '200': { description: updated plan, content: { application/json: { schema: { $ref: '#/components/schemas/MealPlan' } } } }
        '409': { $ref: '#/components/responses/Conflict' }

  /plans/{planId}/decisions:
    parameters:
      - $ref: '#/components/parameters/PlanId'
    post:
      summary: Commit the slot decisions for an approved plan
      operationId: setDecisions
      tags: [plans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/MealPlanDecision' }
      responses:
        '200': { description: decisions persisted, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MealPlanDecision' } } } } }
        '409': { $ref: '#/components/responses/Conflict' }

  /plans/{planId}/candidates:
    parameters:
      - $ref: '#/components/parameters/PlanId'
    get:
      summary: Fetch ranked candidates for all slots in a plan
      operationId: listCandidates
      tags: [plans]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MealPlanCandidate' }

  /plans/{planId}/shopping-requirements:
    parameters:
      - $ref: '#/components/parameters/PlanId'
    get:
      summary: The canonical shopping requirements derived from a plan's decisions
      operationId: listShoppingRequirements
      tags: [shopping]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ShoppingRequirement' }

  /effort-profiles:
    get:
      summary: List effort profiles (kitchen energy per weekday)
      operationId: listEffortProfiles
      tags: [planning]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EffortProfile' }
    post:
      summary: Upsert an effort profile for a weekday
      operationId: upsertEffortProfile
      tags: [planning]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EffortProfile' }
      responses:
        '201': { description: effort profile upserted }

  /constraints:
    get:
      summary: List planning constraints
      operationId: listPlanningConstraints
      tags: [planning]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlanningConstraint' }
    post:
      summary: Create a planning constraint
      operationId: createPlanningConstraint
      tags: [planning]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanningConstraintNew' }
      responses:
        '201': { description: constraint created, content: { application/json: { schema: { $ref: '#/components/schemas/PlanningConstraint' } } } }

  /ingredients/search:
    get:
      summary: Search foods (SLV-backed, client-side name filter)
      operationId: searchFood
      tags: [ingredients]
      parameters:
        - name: q
          in: query
          required: true
          description: name substring to match
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Ingredient' }

  /ingredients/{ingredientId}/nutrition:
    parameters:
      - name: ingredientId
        in: path
        required: true
        description: canonical ingredient id of the form slv-{nummer}
        schema: { type: string }
    get:
      summary: Fetch nutrition for a canonical ingredient id
      operationId: getIngredientNutrition
      tags: [ingredients]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IngredientNutrient' }

  /ingredients/nutrition/{slvNummer}:
    parameters:
      - name: slvNummer
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: Fetch nutrition for an SLV nummer
      operationId: lookupNutrition
      tags: [ingredients]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IngredientNutrient' }

  /stores:
    get:
      summary: List all stores across retailers, optionally ranked by distance from an origin
      operationId: listStores
      tags: [stores]
      parameters:
        - name: latitude
          in: query
          schema: { type: number }
          description: origin latitude (WGS84); when set with longitude, stores are ranked nearest-first
        - name: longitude
          in: query
          schema: { type: number }
          description: origin longitude (WGS84)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Store' }
        '400': { description: latitude/longitude not a number }

  /stores/{storeID}/offers:
    parameters:
      - name: storeID
        in: path
        required: true
        schema: { type: string }
    get:
      summary: List store product offers for a store
      operationId: listStoreOffers
      tags: [stores]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StoreOffer' }

  /products/search:
    get:
      summary: Search products (Matpriskollen)
      operationId: searchProducts
      tags: [products]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IngredientProduct' }

  /products/by-gtin:
    get:
      summary: Search products by GTIN (Matpriskollen)
      operationId: searchProductsByGTIN
      tags: [products]
      parameters:
        - name: gtin
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IngredientProduct' }

  /ingredient-mappings/{ingredient}:
    parameters:
      - name: ingredient
        in: path
        required: true
        description: canonical ingredient id (lowercase, trimmed)
        schema: { type: string }
    get:
      summary: Fetch a mapping, including needs_review flag
      operationId: getIngredientMapping
      tags: [mappings]
      responses:
        '200': { description: mapping, content: { application/json: { schema: { $ref: '#/components/schemas/IngredientMapping' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Resolve a needs_review mapping to a canonical ingredient (review surface)
      operationId: resolveIngredientMapping
      tags: [mappings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngredientMappingResolve' }
      responses:
        '200': { description: updated, content: { application/json: { schema: { $ref: '#/components/schemas/IngredientMapping' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /shopping-lists:
    get:
      summary: List shopping lists
      operationId: listShoppingLists
      tags: [shopping]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ShoppingList' }
    post:
      summary: Create a shopping list
      operationId: createShoppingList
      tags: [shopping]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShoppingListNew' }
      responses:
        '201':
          description: created
          content:
            application/json: { schema: { $ref: '#/components/schemas/ShoppingList' } }

  /shopping-lists/{listId}:
    parameters:
      - $ref: '#/components/parameters/ShoppingListId'
    get:
      summary: Fetch one shopping list
      operationId: getShoppingList
      tags: [shopping]
      responses:
        '200': { description: a shopping list, content: { application/json: { schema: { $ref: '#/components/schemas/ShoppingList' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Archive a shopping list
      operationId: archiveShoppingList
      tags: [shopping]
      responses:
        '200': { description: archived }
        '404': { $ref: '#/components/responses/NotFound' }

  /shopping-lists/{listId}/items:
    parameters:
      - $ref: '#/components/parameters/ShoppingListId'
    get:
      summary: List items on a shopping list
      operationId: listShoppingListItems
      tags: [shopping]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ShoppingListItem' }
    post:
      summary: Add an item to a shopping list
      operationId: addShoppingListItem
      tags: [shopping]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShoppingListItemNew' }
      responses:
        '201':
          description: created
          content:
            application/json: { schema: { $ref: '#/components/schemas/ShoppingListItem' } }

  /shopping-lists/{listId}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/ShoppingListId'
      - $ref: '#/components/parameters/ShoppingListItemId'
    patch:
      summary: Toggle check-off on a shopping list item
      operationId: toggleShoppingListItem
      tags: [shopping]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checked]
              properties:
                checked: { type: boolean }
      responses:
        '200': { description: toggled, content: { application/json: { schema: { $ref: '#/components/schemas/ShoppingListItem' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Remove a shopping list item
      operationId: deleteShoppingListItem
      tags: [shopping]
      responses:
        '204': { description: removed }
        '404': { $ref: '#/components/responses/NotFound' }

  /shopping-lists/{listId}/push:
    parameters:
      - $ref: '#/components/parameters/ShoppingListId'
    post:
      summary: Push a shopping list to its retailer (resolve + create wishlist + bind)
      operationId: pushShoppingList
      tags: [shopping]
      parameters:
        - name: retailer
          in: query
          schema: { type: string, default: willys }
          description: which retailer to push to
      responses:
        '200':
          description: pushed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetailerListBinding' }
        '404': { $ref: '#/components/responses/NotFound' }

  /shopping-lists/{listId}/carts:
    parameters:
      - $ref: '#/components/parameters/ShoppingListId'
    get:
      summary: List carts for a shopping list (via its retailer bindings)
      operationId: listShoppingCarts
      tags: [shopping]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ShoppingCart' }

  /shopping-lists/{listId}/push/to-cart:
    parameters:
      - $ref: '#/components/parameters/ShoppingListId'
    post:
      summary: Create a cart checkpoint from a pushed shopping list
      operationId: toCart
      tags: [shopping]
      parameters:
        - name: retailer
          in: query
          schema: { type: string, default: willys }
      responses:
        '201':
          description: cart checkpoint created
          content:
            application/json: { schema: { $ref: '#/components/schemas/ShoppingCart' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders:
    get:
      summary: List orders (optionally filtered by retailer or cart)
      operationId: listOrders
      tags: [orders]
      parameters:
        - name: retailer
          in: query
          schema: { type: string, nullable: true }
        - name: cartId
          in: query
          schema: { type: integer, nullable: true }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }

  /orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      summary: Fetch one order with its items
      operationId: getOrder
      tags: [orders]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderView' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{orderId}/items:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      summary: List items on an order
      operationId: listOrderItems
      tags: [orders]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderItem' }

  /recipe-families:
    get:
      summary: List recipe families (git-like dish hierarchy)
      operationId: listRecipeFamilies
      tags: [recipe-families]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RecipeFamily' }
    post:
      summary: Create a recipe family
      operationId: createRecipeFamily
      tags: [recipe-families]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecipeFamilyNew' }
      responses:
        '201':
          content:
            application/json: { schema: { $ref: '#/components/schemas/RecipeFamily' } }

  /recipe-families/{familyId}:
    parameters:
      - name: familyId
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Fetch one recipe family
      operationId: getRecipeFamily
      tags: [recipe-families]
      responses:
        '200': { description: a family, content: { application/json: { schema: { $ref: '#/components/schemas/RecipeFamily' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /recipe-families/{familyId}/variants:
    parameters:
      - name: familyId
        in: path
        required: true
        schema: { type: string }
    get:
      summary: List variants of a family
      operationId: listRecipeVariants
      tags: [recipe-families]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RecipeVariant' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Create a variant of a family
      operationId: createRecipeVariant
      tags: [recipe-families]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecipeVariantNew' }
      responses:
        '201':
          content:
            application/json: { schema: { $ref: '#/components/schemas/RecipeVariant' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /recipe-families/{familyId}/variants/{variantId}/revisions:
    parameters:
      - name: familyId
        in: path
        required: true
        schema: { type: string }
      - name: variantId
        in: path
        required: true
        schema: { type: string }
    get:
      summary: List revisions of a variant (newest first)
      operationId: listRecipeRevisions
      tags: [recipe-families]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RecipeRevision' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Create a revision of a variant (optionally derived from a parent)
      operationId: createRecipeRevision
      tags: [recipe-families]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecipeRevisionNew' }
      responses:
        '201':
          content:
            application/json: { schema: { $ref: '#/components/schemas/RecipeRevision' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /recipe-families/{familyId}/variants/{variantId}/revisions/{revisionId}:
    parameters:
      - name: familyId
        in: path
        required: true
        schema: { type: string }
      - name: variantId
        in: path
        required: true
        schema: { type: string }
      - name: revisionId
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Fetch one revision
      operationId: getRecipeRevision
      tags: [recipe-families]
      responses:
        '200': { description: a revision, content: { application/json: { schema: { $ref: '#/components/schemas/RecipeRevision' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /recipe-families/{familyId}/variants/{variantId}/default:
    parameters:
      - name: familyId
        in: path
        required: true
        schema: { type: string }
      - name: variantId
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Pin a variant as the family's default (expanded) variant
      operationId: setRecipeFamilyDefaultVariant
      tags: [recipe-families]
      responses:
        '200': { description: ok, content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /recipes/{recipeId}/favorites:
    parameters:
      - $ref: '#/components/parameters/RecipeId'
    get:
      summary: List favorites for a recipe
      operationId: listRecipeFavorites
      tags: [favorites]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Favorite' }
    post:
      summary: Mark a recipe as a favorite (person- or household-scoped)
      operationId: setRecipeFavorite
      tags: [favorites]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FavoriteNew' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { type: object } } } }
    delete:
      summary: Remove a favorite marker
      operationId: unsetRecipeFavorite
      tags: [favorites]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FavoriteNew' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { type: object } } } }

  /recipes/{recipeId}/rating:
    parameters:
      - $ref: '#/components/parameters/RecipeId'
    get:
      summary: Get the weighted average rating for a recipe
      operationId: getRecipeRating
      tags: [favorites]
      responses:
        '200': { description: a rating, content: { application/json: { schema: { $ref: '#/components/schemas/RecipeRating' } } } }

  /recipes/discover:
    post:
      summary: Fetch an external recipe URL, extract JSON-LD, and stage a review candidate
      operationId: discoverRecipe
      tags: [discovery]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiscoverRecipeRequest' }
      responses:
        '201':
          content:
            application/json: { schema: { $ref: '#/components/schemas/ImportCandidate' } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /recipes/discovery/candidates:
    get:
      summary: List staged import candidates, optionally filtered by status
      operationId: listImportCandidates
      tags: [discovery]
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ImportCandidate' }

  /recipes/discovery/candidates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Fetch one import candidate with its ingredient lines
      operationId: getImportCandidate
      tags: [discovery]
      responses:
        '200': { description: a candidate, content: { application/json: { schema: { $ref: '#/components/schemas/ImportCandidate' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /recipes/discovery/candidates/{id}/reject:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Reject a non-promoted import candidate
      operationId: rejectImportCandidate
      tags: [discovery]
      responses:
        '200': { description: ok, content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /recipes/discovery/candidates/{id}/promote:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Promote a candidate into the native recipe_family hierarchy
      operationId: promoteImportCandidate
      tags: [discovery]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromoteCandidateRequest' }
      responses:
        '200':
          content:
            application/json: { schema: { $ref: '#/components/schemas/PromoteCandidateResponse' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /prices:
    get:
      summary: Current prices per retailer product across stores (cheapest store computed)
      operationId: listProductPrices
      tags: [prices]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductPriceGroup' }

  /grocy/status:
    get:
      summary: Report whether a Grocy instance is configured and reachable
      operationId: grocyStatus
      tags: [grocy]
      responses:
        '200':
          description: grocy status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrocyStatus' }

  /grocy/products:
    get:
      summary: List the Grocy product catalog
      operationId: grocyListProducts
      tags: [grocy]
      responses:
        '200':
          description: grocy products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GrocyProduct' }
        '502': { description: grocy unreachable }
        '503': { description: grocy not configured }

  /grocy/stock:
    get:
      summary: List current Grocy stock lots (zero-amount lots excluded)
      operationId: grocyListStock
      tags: [grocy]
      responses:
        '200':
          description: grocy stock lots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GrocyStockEntry' }
        '502': { description: grocy unreachable }
        '503': { description: grocy not configured }

  /grocy/shopping-list:
    get:
      summary: List the Grocy shopping list
      operationId: grocyListShoppingList
      tags: [grocy]
      responses:
        '200':
          description: grocy shopping list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GrocyShoppingItem' }
        '502': { description: grocy unreachable }
        '503': { description: grocy not configured }

  /grocy/stock/add:
    post:
      summary: Add stock to a Grocy product
      operationId: grocyAddStock
      tags: [grocy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, amount]
              properties:
                product_id: { type: integer }
                amount: { type: number }
                best_before: { type: string, description: YYYY-MM-DD, optional }
      responses:
        '200': { description: ok }
        '400': { description: invalid body }
        '502': { description: grocy unreachable }
        '503': { description: grocy not configured }

  /grocy/stock/consume:
    post:
      summary: Consume stock from a Grocy product
      operationId: grocyConsumeStock
      tags: [grocy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, amount]
              properties:
                product_id: { type: integer }
                amount: { type: number }
      responses:
        '200': { description: ok }
        '400': { description: invalid body }
        '502': { description: grocy unreachable }
        '503': { description: grocy not configured }

  /grocy/shopping-list/items:
    post:
      summary: Add a line to the Grocy shopping list (free-text when product_id is 0)
      operationId: grocyAddShoppingItem
      tags: [grocy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                product_id: { type: integer, description: 0 for a free-text item }
                note: { type: string }
                amount: { type: number }
      responses:
        '200': { description: ok }
        '400': { description: invalid body }
        '502': { description: grocy unreachable }
        '503': { description: grocy not configured }

  /inspiration:
    get:
      summary: Suggest recipes ranked by how much of them is already in the pantry
      operationId: suggestInspiration
      tags: [inspiration]
      responses:
        '200':
          description: recipes ranked by pantry coverage (most-matched first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InspirationSuggestion' }

  /ingredient-aliases:
    get:
      summary: List a household's ingredient nicknames (including global aliases)
      operationId: listIngredientAliases
      tags: [ingredients]
      parameters:
        - name: householdId
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IngredientAlias' }
    post:
      summary: Add (or re-assert) a nickname → canonical ingredient mapping
      operationId: createIngredientAlias
      tags: [ingredients]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngredientAliasNew' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngredientAlias' }
        '400': { description: alias or ingredient_id missing }

  /ingredient-aliases/resolve/{alias}:
    parameters:
      - name: alias
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Resolve a nickname to its canonical ingredient id
      operationId: resolveIngredientAlias
      tags: [ingredients]
      parameters:
        - name: householdId
          in: query
          schema: { type: string }
        - name: alias
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  ingredient_id: { type: string }

  /ingredient-aliases/{alias}:
    parameters:
      - name: alias
        in: path
        required: true
        schema: { type: string }
    delete:
      summary: Remove a nickname mapping
      operationId: deleteIngredientAlias
      tags: [ingredients]
      parameters:
        - name: householdId
          in: query
          schema: { type: string }
        - name: alias
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: deleted }

  /widgets/dashboard:
    get:
      summary: Aggregate dashboard (tonight's meal, pantry summary, expiring items) in one round-trip
      operationId: getDashboard
      tags: [widgets]
      parameters:
        - name: householdId
          in: query
          schema: { type: string }
          description: household to build the dashboard for
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }

  /pantry/expiring:
    get:
      summary: Lots whose best_before is within the window (already expired or expiring soon)
      operationId: listExpiringLots
      tags: [pantry]
      parameters:
        - name: withinHours
          in: query
          schema: { type: integer }
          description: window in hours (default 168 = 7 days)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PantryLot' }

  /pantry/lots/{id}/discard:
    post:
      summary: Discard part or all of a pantry lot
      operationId: discardPantryLot
      tags: [pantry]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PantryDiscardNew' }
      responses:
        '200':
          description: updated lot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PantryLot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /pantry/lots/{id}/adjust:
    post:
      summary: Correct the observed quantity of a pantry lot
      operationId: adjustPantryLot
      tags: [pantry]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PantryAdjustNew' }
      responses:
        '200':
          description: updated lot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PantryLot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /pantry/lots/{id}/mark-empty:
    post:
      summary: Mark a pantry lot as empty
      operationId: markPantryLotEmpty
      tags: [pantry]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: updated lot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PantryLot' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /pantry/lots/{id}/open:
    post:
      summary: Record that a sealed pantry lot was opened
      operationId: openPantryLot
      tags: [pantry]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PantryOpenNew' }
      responses:
        '200':
          description: updated lot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PantryLot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /pantry/lots/{id}/transfer:
    post:
      summary: Move part or all of a pantry lot to another location
      operationId: transferPantryLot
      tags: [pantry]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PantryTransferNew' }
      responses:
        '200':
          description: updated lot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PantryLot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  parameters:
    ShoppingListId:
      name: listId
      in: path
      required: true
      schema: { type: integer }
    ShoppingListItemId:
      name: itemId
      in: path
      required: true
      schema: { type: integer }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: integer }

    PersonId:
      name: personId
      in: path
      required: true
      schema: { type: string }
    RecipeId:
      name: recipeId
      in: path
      required: true
      schema: { type: string }
    PlanId:
      name: planId
      in: path
      required: true
      schema: { type: integer }

  responses:
    BadRequest:
      description: invalid request
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: resource not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: state conflict (e.g. decisions on a non-approved plan)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    InternalServerError:
      description: internal server error
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }

    Health:
      type: object
      properties:
        status: { type: string, enum: [ok], default: ok }

    Person:
      type: object
      required: [id, name, weight, created_at]
      properties:
        id: { type: string, description: canonical id }
        name: { type: string }
        weight: { type: number, format: double, default: 1.0, minimum: 0, exclusiveMinimum: true }
        created_at: { type: string, format: date-time }

    PersonNew:
      type: object
      required: [name]
      properties:
        name: { type: string }
        weight: { type: number, format: double, default: 1.0, minimum: 0, exclusiveMinimum: true }

    PersonUpdate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        weight: { type: number, format: double, minimum: 0, exclusiveMinimum: true, description: 0/omitted leaves the existing weight unchanged }

    PersonPreference:
      type: object
      required: [person_id, tag, sentiment, confidence, updated_at]
      properties:
        person_id: { type: string }
        tag: { type: string }
        sentiment: { type: integer, minimum: -2, maximum: 2, description: -2 (strongly dislike) to 2 (love) }
        confidence: { type: number, format: double, minimum: 0, maximum: 1 }
        updated_at: { type: string, format: date-time }

    PersonPreferenceNew:
      type: object
      required: [person_id, tag, sentiment, confidence]
      properties:
        person_id: { type: string }
        tag: { type: string }
        sentiment: { type: integer, minimum: -2, maximum: 2, description: -2 (strongly dislike) to 2 (love) }
        confidence: { type: number, format: double, minimum: 0, maximum: 1 }

    RecipeRef:
      type: object
      required: [mealie_recipe_id, title, tags, effort, last_synced_at]
      properties:
        mealie_recipe_id: { type: string }
        title: { type: string }
        tags: { type: array, items: { type: string } }
        effort: { type: integer, minimum: 1, maximum: 3, description: 1 (quick) to 3 (intense) }
        last_synced_at: { type: string, format: date-time }

    Ingredient:
      type: object
      required: [id, display]
      properties:
        id: { type: string, description: canonical id, e.g. slv-12345 }
        display: { type: string, description: human-friendly name }
        source: { type: string, description: upstream source (slv, dabas, matpriskollen) }
        slv_nummer: { type: integer, description: SLV nummer when source is slv }
        gtin: { type: string }
        brand: { type: string }

    IngredientNutrient:
      type: object
      required: [name, value, unit]
      properties:
        name: { type: string, description: nutrient name, e.g. Energi }
        value: { type: number, format: double, description: value per 100 g edible portion }
        unit: { type: string, description: unit, e.g. kJ, g, mg }

    IngredientProduct:
      type: object
      required: [key, name]
      properties:
        key: { type: string }
        gtin: { type: string }
        name: { type: string }
        brand: { type: string }
        description: { type: string }
        amount: { type: string }
        image_url: { type: string }

    Store:
      type: object
      required: [id, retailer_id, name]
      properties:
        id: { type: string }
        retailer_id: { type: string }
        retailer_name: { type: string }
        name: { type: string }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        # Great-circle distance from the request origin in kilometres; null when
        # the store has no position or no origin was supplied.
        distance_km: { type: number, nullable: true }

    # ── Grocy (self-hosted inventory/recipe integration) ──────────────────────
    GrocyStatus:
      type: object
      required: [configured, reachable]
      properties:
        configured: { type: boolean }
        reachable: { type: boolean }
        version: { type: string }
        base_url: { type: string }

    GrocyProduct:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        barcode: { type: string }
        location_id: { type: integer }
        qu_id_stock: { type: integer }
        qu_id_purchase: { type: integer }
        min_stock_amount: { type: number }

    GrocyStockEntry:
      type: object
      required: [id, product_id, product_name, amount, qu_id, location_id]
      properties:
        id: { type: integer }
        product_id: { type: integer }
        product_name: { type: string }
        amount: { type: number }
        qu_id: { type: integer }
        location_id: { type: integer }
        best_before: { type: string, description: YYYY-MM-DD, empty when unset }

    GrocyShoppingItem:
      type: object
      required: [id, product_id, note, amount, qu_id, done]
      properties:
        id: { type: integer }
        product_id: { type: integer, description: 0 for a free-text item }
        note: { type: string }
        amount: { type: number }
        qu_id: { type: integer }
        done: { type: boolean }

    # ── Inspiration (what can I make from my pantry) ──────────────────────────
    InspirationSuggestion:
      type: object
      required: [mealie_recipe_id, title, tags, effort, total_ingredients, matched_ingredient_ids, missing_ingredient_ids, match_ratio]
      properties:
        mealie_recipe_id: { type: string }
        title: { type: string }
        tags:
          type: array
          items: { type: string }
        effort: { type: integer, minimum: 1, maximum: 3 }
        total_ingredients: { type: integer }
        matched_ingredient_ids:
          type: array
          items: { type: string }
          description: recipe ingredients already in the pantry
        missing_ingredient_ids:
          type: array
          items: { type: string }
          description: recipe ingredients still needed
        match_ratio: { type: number, format: double, minimum: 0, maximum: 1, description: 1 = fully cookable from pantry }

    # ── Ingredient aliases (household nicknames) ──────────────────────────────
    IngredientAlias:
      type: object
      required: [id, alias, ingredient_id, created_at]
      properties:
        id: { type: integer, format: int64 }
        household_id: { type: string, nullable: true, description: empty/null = global alias }
        alias: { type: string, description: normalized nickname, e.g. 'potatis' }
        ingredient_id: { type: string }
        created_at: { type: string, format: date-time }

    IngredientAliasNew:
      type: object
      required: [alias, ingredient_id]
      properties:
        household_id: { type: string, description: empty = global alias }
        alias: { type: string }
        ingredient_id: { type: string }

    # ── Dashboard / widgets ───────────────────────────────────────────────────
    Dashboard:
      type: object
      required: [pantry, expiring]
      properties:
        tonight: { $ref: '#/components/schemas/DashboardTonight' }
        pantry: { $ref: '#/components/schemas/DashboardPantry' }
        expiring:
          type: array
          items: { $ref: '#/components/schemas/DashboardExpiringLot' }

    DashboardTonight:
      type: object
      required: [served_on, recipe]
      properties:
        served_on: { type: string }
        recipe: { $ref: '#/components/schemas/RecipeRef' }

    DashboardPantry:
      type: object
      required: [locations, lots, expiring]
      properties:
        locations: { type: integer }
        lots: { type: integer }
        expiring: { type: integer }

    DashboardExpiringLot:
      type: object
      required: [ingredient_id, quantity, unit]
      properties:
        ingredient_id: { type: string }
        quantity: { type: number }
        unit: { type: string }
        best_before: { type: string, format: date-time, nullable: true }

    PantryLot:
      type: object
      required: [id, ingredient_id, product_id, location_id, quantity, unit, confidence, created_at, updated_at]
      properties:
        id: { type: string }
        ingredient_id: { type: string }
        product_id: { type: string }
        location_id: { type: string }
        quantity: { type: number }
        unit: { type: string }
        confidence: { type: string }
        best_before: { type: string, format: date-time, nullable: true }
        opened_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PantryDiscardNew:
      type: object
      required: [quantity, source]
      properties:
        quantity: { type: number, minimum: 0, exclusiveMinimum: true }
        estimated: { type: boolean, default: false }
        reason: { type: string }
        source: { type: string }

    PantryAdjustNew:
      type: object
      required: [quantity, source]
      properties:
        quantity: { type: number, minimum: 0 }
        estimated: { type: boolean, default: false }
        reason: { type: string }
        source: { type: string }

    PantryOpenNew:
      type: object
      required: [source]
      properties:
        source: { type: string }

    PantryTransferNew:
      type: object
      required: [location_id, quantity, source]
      properties:
        location_id: { type: string }
        quantity: { type: number, minimum: 0, exclusiveMinimum: true }
        source: { type: string }

    StoreOffer:
      type: object
      required: [id, store_id, retailer_product_id, currently_carried, updated_at]
      properties:
        id: { type: integer, format: int64 }
        store_id: { type: string }
        retailer_product_id: { type: string }
        currently_carried: { type: boolean }
        updated_at: { type: string, format: date-time }

    IngredientMapping:
      type: object
      required: [mealie_food_id, ingredient_id, source_name, needs_review, updated_at]
      properties:
        mealie_food_id: { type: string }
        ingredient_id: { type: string, description: canonical ingredient id (see Ingredient.id) }
        source_name: { type: string }
        external_id: { type: string, nullable: true }
        needs_review: { type: boolean, default: true }
        updated_at: { type: string, format: date-time }

    IngredientMappingResolve:
      type: object
      required: [ingredient_id]
      properties:
        ingredient_id: { type: string }
        acceptable_forms: { type: array, items: { type: string } }
        preferred_form: { type: string, nullable: true }

    MealEvent:
      type: object
      required: [id, mealie_recipe_id, served_on, created_at, reactions]
      properties:
        id: { type: integer }
        mealie_recipe_id: { type: string }
        served_on: { type: string, format: date }
        created_at: { type: string, format: date-time }
        reactions:
          type: array
          items: { $ref: '#/components/schemas/MealReaction' }

    MealReaction:
      type: object
      required: [person_id, sentiment]
      properties:
        person_id: { type: string }
        sentiment: { type: integer, minimum: -2, maximum: 2 }

    MealEventNew:
      type: object
      required: [mealie_recipe_id, served_on]
      properties:
        mealie_recipe_id: { type: string }
        served_on: { type: string, format: date }
        reactions:
          type: array
          items: { $ref: '#/components/schemas/MealReaction' }

    MealPlan:
      type: object
      required: [id, week_start, status, created_at]
      properties:
        id: { type: integer }
        week_start: { type: string, format: date, description: Monday of the planned week }
        status: { type: string, enum: [draft, approved, archived], default: draft }
        created_at: { type: string, format: date-time }

    MealPlanNew:
      type: object
      properties:
        week_start: { type: string, format: date }

    MealPlanUpdate:
      type: object
      properties:
        status: { type: string, enum: [draft, approved, archived] }

    MealPlanCandidate:
      type: object
      required: [id, recipe, slot_date, score, breakdown, feasible, rank]
      properties:
        id: { type: integer }
        recipe: { $ref: '#/components/schemas/RecipeRef' }
        slot_date: { type: string, format: date }
        score: { type: number, format: double }
        breakdown:
          type: object
          description: per-signal score breakdown (pref, effort, repeat, school, campaign, familiarity, novelty)
          additionalProperties: { type: number, format: double }
        feasible: { type: boolean }
        rank: { type: integer, minimum: 0 }

    MealPlanDecision:
      type: object
      required: [plan_id, slot_date, mealie_recipe_id]
      properties:
        plan_id: { type: integer }
        slot_date: { type: string, format: date }
        mealie_recipe_id: { type: string }
        decided_at: { type: string, format: date-time, nullable: true }

    MealPlanView:
      type: object
      required: [plan, candidates]
      properties:
        plan: { $ref: '#/components/schemas/MealPlan' }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/MealPlanCandidate' }
        decisions:
          type: array
          items: { $ref: '#/components/schemas/MealPlanDecision' }

    ShoppingRequirement:
      type: object
      required: [id, ingredient_id, quantity, unit, acceptable_forms, preferred_form]
      properties:
        id: { type: integer }
        ingredient_id: { type: string }
        quantity: { type: number, format: double }
        unit: { type: string }
        acceptable_forms: { type: array, items: { type: string } }
        preferred_form: { type: string, nullable: true }

    EffortProfile:
      type: object
      required: [weekday, kitchen_energy]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6, description: 0=Sunday .. 6=Saturday }
        kitchen_energy: { type: integer, minimum: 1, maximum: 3 }

    TonightView:
      type: object
      description: "Tonight's meal: the recipe + any reactions recorded so far"
      required: [served_on, recipe, reactions]
      properties:
        served_on: { type: string, format: date, description: today's date }
        recipe:
          $ref: '#/components/schemas/RecipeRef'
        reactions:
          type: array
          items: { $ref: '#/components/schemas/MealReaction' }
          description: reactions already recorded for today's meal event

    PlanningConstraint:
      type: object
      required: [id, kind, value, active]
      properties:
        id: { type: integer }
        kind: { type: string, description: constraint kind (e.g. avoid_tag, max_effort) }
        value: { type: string, description: constraint value }
        active: { type: boolean, description: whether the constraint is active }

    PlanningConstraintNew:
      type: object
      required: [kind, value, active]
      properties:
        kind: { type: string }
        value: { type: string }
        active: { type: boolean }

    ReactionNew:
      type: object
      required: [person_id, sentiment]
      properties:
        person_id: { type: string, description: who is reacting }
        sentiment: { type: integer, minimum: -2, maximum: 2, description: "-2 (hate) .. 2 (love)" }
        note: { type: string, nullable: true, description: optional free-text note }

    PlanRunInput:
      type: object
      properties:
        week: { type: string, description: "ISO week, e.g. 2026-W31 (default: next week)" }
        days: { type: integer, minimum: 1, maximum: 10, description: "number of dinners (default: 7)" }
        create_wishlist: { type: boolean, description: "resolve products and create Willys wishlist" }

    PlanRunResult:
      type: object
      required: [status, message]
      properties:
        status: { type: string, enum: [accepted, failed], description: "accepted = queued, failed = error" }
        message: { type: string, description: human-readable result summary }
        week_start: { type: string, format: date, nullable: true, description: "Monday of the planned week" }
    PlanProgress:
      type: object
      required: [phase, message, at]
      description: >-
        One SSE progress event for a running plan (POST /plans/run/stream). The
        payload shape is intentionally minimal and not finalized until the
        frontend's SSE consumer needs it (task 3.4).
      properties:
        phase: { type: string, enum: [started, planning, resolving, wishlist, done], description: "the phase the run has reached" }
        message: { type: string, description: human-readable progress detail }
        at: { type: string, format: date-time, description: "when the phase was reached" }
    ShoppingList:
      type: object
      required: [id, name, status, created_at]
      properties:
        id: { type: integer }
        owner_person_id: { type: string, nullable: true, description: "person who owns the list; null = shared" }
        name: { type: string }
        status: { type: string, enum: [active, archived] }
        created_at: { type: string, format: date-time }

    ShoppingListNew:
      type: object
      required: [name]
      properties:
        name: { type: string }
        owner_person_id: { type: string, nullable: true }

    ShoppingListItem:
      type: object
      required: [id, shopping_list_id, quantity, unit, checked, added_at]
      properties:
        id: { type: integer }
        shopping_list_id: { type: integer }
        shopping_requirement_id: { type: integer, nullable: true }
        ingredient_id: { type: string, nullable: true }
        label: { type: string, nullable: true }
        quantity: { type: number }
        unit: { type: string }
        checked: { type: boolean }
        added_at: { type: string, format: date-time }

    ShoppingListItemNew:
      type: object
      required: [quantity, unit]
      properties:
        shopping_requirement_id: { type: integer, nullable: true }
        ingredient_id: { type: string, nullable: true }
        label: { type: string, nullable: true }
        quantity: { type: number }
        unit: { type: string }

    RetailerListBinding:
      type: object
      required: [id, shopping_list_id, retailer, external_list_id, sync_direction]
      properties:
        id: { type: integer }
        shopping_list_id: { type: integer }
        retailer: { type: string }
        external_list_id: { type: string }
        sync_direction: { type: string, enum: [outbound] }
        last_pushed_at: { type: string, format: date-time, nullable: true }
        last_push_status: { type: string, enum: [success, error], nullable: true }

    ShoppingCart:
      type: object
      required: [id, retailer_list_binding_id, created_at, status]
      properties:
        id: { type: integer }
        retailer_list_binding_id: { type: integer }
        created_at: { type: string, format: date-time }
        status: { type: string, enum: [created, confirmed, abandoned] }

    ShoppingCartItem:
      type: object
      required: [id, shopping_cart_id, retailer_product_id, quantity, unit]
      properties:
        id: { type: integer }
        shopping_cart_id: { type: integer }
        retailer_product_id: { type: string }
        quantity: { type: number }
        unit: { type: string }
        resolved_price: { type: number, nullable: true }

    Order:
      type: object
      required: [id, retailer, source, ordered_at]
      properties:
        id: { type: integer }
        shopping_cart_id: { type: integer, nullable: true }
        retailer: { type: string }
        source: { type: string, enum: [manual, retailer_api, receipt_import] }
        ordered_at: { type: string, format: date-time }
        total_price: { type: number, nullable: true }

    OrderView:
      type: object
      required: [order, items]
      properties:
        order: { $ref: '#/components/schemas/Order' }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }

    OrderItem:
      type: object
      required: [id, order_id, retailer_product_id, quantity]
      properties:
        id: { type: integer }
        order_id: { type: integer }
        retailer_product_id: { type: string }
        quantity: { type: number }
        unit_price: { type: number, nullable: true }
        total_price: { type: number, nullable: true }
        substituted_for_item_id: { type: integer, nullable: true }

    # ── Recipe family (git-like dish hierarchy) ──────────────────────────────
    RecipeFamily:
      type: object
      required: [id, name, archived, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        default_variant_id: { type: string, nullable: true }
        archived: { type: boolean }
        created_at: { type: string, format: date-time }

    RecipeFamilyNew:
      type: object
      required: [name]
      properties:
        id: { type: string, description: slug; derived from name when omitted }
        name: { type: string }
        description: { type: string }

    RecipeVariant:
      type: object
      required: [id, family_id, title, archived, created_at]
      properties:
        id: { type: string }
        family_id: { type: string }
        title: { type: string }
        source_attribution: { type: string, nullable: true }
        archived: { type: boolean }
        created_at: { type: string, format: date-time }

    RecipeVariantNew:
      type: object
      required: [title]
      properties:
        id: { type: string, description: slug; derived from title when omitted }
        title: { type: string }
        source_attribution: { type: string }

    RecipeRevision:
      type: object
      required: [id, variant_id, ingredients, steps, created_at]
      properties:
        id: { type: string }
        variant_id: { type: string }
        servings: { type: integer, nullable: true }
        description: { type: string, nullable: true }
        ingredients:
          type: array
          items: { $ref: '#/components/schemas/RecipeIngredient' }
        steps:
          type: array
          items: { type: string }
        parents:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }

    RecipeRevisionNew:
      type: object
      required: [ingredients, steps]
      properties:
        servings: { type: integer }
        description: { type: string }
        ingredients:
          type: array
          items: { $ref: '#/components/schemas/RecipeIngredient' }
        steps:
          type: array
          items: { type: string }
        parent_revision_id: { type: string, nullable: true, description: derive from this revision }

    RecipeIngredient:
      type: object
      required: [ingredient_id, quantity, unit]
      properties:
        ingredient_id: { type: string }
        quantity: { type: number }
        unit: { type: string }
        raw_text: { type: string }
        acceptable_forms:
          type: array
          items: { type: string }
        preferred_form: { type: string }

    # ── Recipe discovery (external URL -> review candidate -> promotion) ─────
    DiscoverRecipeRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, description: absolute http(s) URL of the recipe page }
        source_id: { type: string, description: defaults to web-jsonld when omitted }

    ImportCandidateIngredient:
      type: object
      required: [line_no, raw_text, unit, needs_review]
      properties:
        line_no: { type: integer }
        raw_text: { type: string }
        quantity: { type: number, nullable: true }
        unit: { type: string }
        ingredient_id: { type: string, nullable: true }
        needs_review: { type: boolean, description: true when the line could not be fully resolved }

    ImportCandidate:
      type: object
      required: [id, source_id, source_url, title, imported_at, status, ingredients]
      properties:
        id: { type: string }
        source_id: { type: string }
        source_url: { type: string }
        external_id: { type: string, nullable: true }
        title: { type: string }
        description: { type: string, nullable: true }
        image_url: { type: string, nullable: true }
        servings: { type: integer, nullable: true }
        prep_time_sec: { type: integer, nullable: true }
        cook_time_sec: { type: integer, nullable: true }
        total_time_sec: { type: integer, nullable: true }
        category: { type: string, nullable: true }
        cuisine: { type: string, nullable: true }
        attribution: { type: string, nullable: true }
        rating: { type: number, nullable: true }
        rating_count: { type: integer, nullable: true }
        license_note: { type: string, nullable: true }
        imported_at: { type: string, format: date-time }
        status: { type: string, enum: [candidate, promoted, rejected] }
        promoted_variant_id: { type: string, nullable: true }
        ingredients:
          type: array
          items: { $ref: '#/components/schemas/ImportCandidateIngredient' }

    PromoteCandidateRequest:
      type: object
      properties:
        family_id: { type: string, description: reuse an existing family; a new family is created when omitted }

    PromoteCandidateResponse:
      type: object
      required: [family_id, variant_id, revision_id, candidate_status]
      properties:
        family_id: { type: string }
        variant_id: { type: string }
        revision_id: { type: string }
        candidate_status: { type: string, enum: [promoted] }

    # ── Favorites / ratings ───────────────────────────────────────────────────
    Favorite:
      type: object
      required: [id, mealie_recipe_id, created_at]
      properties:
        id: { type: integer }
        person_id: { type: string, nullable: true }
        household_id: { type: string, nullable: true }
        mealie_recipe_id: { type: string }
        created_at: { type: string, format: date-time }

    FavoriteNew:
      type: object
      properties:
        person_id: { type: string, description: set exactly one of person_id / household_id }
        household_id: { type: string }

    RecipeRating:
      type: object
      required: [mealie_recipe_id, average, review_count]
      properties:
        mealie_recipe_id: { type: string }
        average: { type: number }
        review_count: { type: integer }

    # ── Price intelligence ────────────────────────────────────────────────────
    ProductPriceGroup:
      type: object
      required: [retailer_product_id, retailer_id, prices]
      properties:
        retailer_product_id: { type: string }
        product_id: { type: string, nullable: true }
        display_name: { type: string, nullable: true }
        retailer_id: { type: string }
        retailer_name: { type: string }
        prices:
          type: array
          items: { $ref: '#/components/schemas/StorePrice' }
        cheapest: { $ref: '#/components/schemas/StorePrice' }

    StorePrice:
      type: object
      required: [store_id, retailer_id, price_kind, price, observed_at, source]
      properties:
        store_id: { type: string }
        store_name: { type: string }
        retailer_id: { type: string }
        retailer_name: { type: string }
        price_kind: { type: string, enum: [regular, member, campaign] }
        price: { type: number }
        observed_at: { type: string, format: date-time }
        source: { type: string }



