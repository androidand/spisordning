# spisordning deployment baseline (design D7): plain docker-compose.
# Tengil `package` deployment is the strategic target, planned in the tengil repo.
#
# Usage:
#   cp .env.example .env   # fill in Willys credentials
#   docker compose up -d
#
# NOTE: the willys-adapter build context points at the sibling willys-client
# repo; keep ~/dev/willys checked out next to ~/dev/spisordning.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: spisordning
      POSTGRES_USER: spisordning
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Apply the schema on first boot.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spisordning']
      interval: 5s
      timeout: 3s
      retries: 10

  willys-adapter:
    build:
      context: ../willys/willys-client
      dockerfile: Dockerfile.adapter
    restart: unless-stopped
    environment:
      ADAPTER_PORT: '8402'
      WILLYS_USERNAME: ${WILLYS_USERNAME:?set in .env}
      WILLYS_PASSWORD: ${WILLYS_PASSWORD:?set in .env}
    ports:
      - '8402:8402'

  # food-brain joins here once it grows an HTTP server (currently a CLI demo:
  # `go run ./cmd/food-brain`). Planned in the same openspec change.

volumes:
  pgdata:
