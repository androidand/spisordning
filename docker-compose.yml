# spisordning: LOCAL DEV ONLY. Spins up its own ephemeral postgres + applies migrations
# to it — safe to blow away and recreate, never points at real household data.
#
#   cp .env.example .env   # fill in Willys credentials
#   docker compose up -d
#
# For the REAL Proxmox deployment, use docker-compose.proxmox.yml instead — spisordning
# already has a real database (main-postgres, VMID 2327, 192.168.1.93:5432, real household
# data; see docs/infrastructure/deployment-and-access.md) and this file must never be
# pointed at it. Deploy via:
#   katla stack deploy -node proxmox -compose docker-compose.proxmox.yml -env-file .env.proxmox
#
# willys-adapter is intentionally NOT a service here either: a standalone instance already
# runs on Proxmox (stack:willys-adapter, VMID 2335) logged into the real Willys account.
# Local food-brain points ADAPTER_URL at it directly (below) rather than running a second,
# separately-logged-in adapter locally. (Longer-term, folding store-clients' generated Go
# client into food-brain directly and retiring the adapter service entirely is its own
# OpenSpec change: embed-retailer-clients-in-food-brain.)

services:
  postgres:
    image: postgres:19beta3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: spisordning
      POSTGRES_USER: spisordning
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spisordning']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot schema migration: applies the embedded Goose migrations (and seeds)
  # before the app starts. The image must include the `migrate` command (see
  # establish-migration-and-postgres-19). food-brain depends on this completing.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: spisordning
      POSTGRES_USER: spisordning
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["food-brain"]
    command: ["migrate", "up", "--seed"]

  food-brain:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # food-brain reads postgres + homelab services from .env; see .env.example.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: spisordning
      POSTGRES_USER: spisordning
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Stockholm
      MEALIE_BASE_URL: ${MEALIE_BASE_URL:-http://hlab-mealie:9000}
      MEALIE_API_TOKEN: ${MEALIE_API_TOKEN:-}
      OLLA_OPENAI_BASE_URL: ${OLLA_OPENAI_BASE_URL:-}
      SKOLMATEN_BASE_URL: ${SKOLMATEN_BASE_URL:-}
      # The standalone willys-adapter instance already running on Proxmox (see the
      # header comment) — not a service in this compose file.
      ADAPTER_URL: ${ADAPTER_URL:-http://192.168.1.171:8402}
    ports:
      - '8080:8080'

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # The image ENTRYPOINT is food-brain; override it to run the MCP server.
    entrypoint: ["mcp-server"]
    command: []
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: spisordning
      POSTGRES_USER: spisordning
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SPISORNING_MCP_ADDR: ':8081'
    ports:
      - '8081:8081'

volumes:
  pgdata:
