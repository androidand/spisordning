# spisordning deployment: docker-compose (local) + Tengil compose package.
#
# Local usage:
#   cp .env.example .env   # fill in Willys credentials
#   docker compose up -d
#
# Tengil usage:
#   Deploy via POST /api/apps with type=compose (see openspec/changes/deploy-via-docker-compose/)

services:
  postgres:
    image: postgres:19beta3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: spisordning
      POSTGRES_USER: spisordning
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spisordning']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot schema migration: applies the embedded Goose migrations (and seeds)
  # before the app starts. The image must include the `migrate` command (see
  # establish-migration-and-postgres-19). food-brain depends on this completing.
  migrate:
    image: ghcr.io/androidand/spisordning/food-brain:latest
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://spisordning:${POSTGRES_PASSWORD}@postgres:5432/spisordning?sslmode=disable
    entrypoint: ["food-brain"]
    command: ["migrate", "up", "--seed"]

  willys-adapter:
    image: ghcr.io/androidand/spisordning/willys-adapter:latest
    restart: unless-stopped
    environment:
      ADAPTER_PORT: '8402'
      WILLYS_USERNAME: ${WILLYS_USERNAME}
      WILLYS_PASSWORD: ${WILLYS_PASSWORD}
    ports:
      - '8402:8402'

  food-brain:
    image: ghcr.io/androidand/spisordning/food-brain:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # food-brain reads postgres + homelab services from .env; see .env.example.
      DATABASE_URL: postgres://spisordning:${POSTGRES_PASSWORD}@postgres:5432/spisordning?sslmode=disable
      TZ: Europe/Stockholm
      MEALIE_BASE_URL: ${MEALIE_BASE_URL:-http://hlab-mealie:9000}
      MEALIE_API_TOKEN: ${MEALIE_API_TOKEN:-}
      OLLA_OPENAI_BASE_URL: ${OLLA_OPENAI_BASE_URL:-}
      SKOLMATEN_BASE_URL: ${SKOLMATEN_BASE_URL:-}
      ADAPTER_URL: ${ADAPTER_URL:-http://willys-adapter:8402}
    ports:
      - '8080:8080'

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # The image ENTRYPOINT is food-brain; override it to run the MCP server.
    entrypoint: ["mcp-server"]
    command: []
    environment:
      DATABASE_URL: postgres://spisordning:${POSTGRES_PASSWORD}@postgres:5432/spisordning?sslmode=disable
      SPISORNING_MCP_ADDR: ':8081'
    ports:
      - '8081:8081'

volumes:
  pgdata:
