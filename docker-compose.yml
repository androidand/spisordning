# spisordning deployment baseline (design D7): plain docker-compose.
# Tengil `package` deployment is the strategic target, planned in the tengil repo.
#
# Usage:
#   cp .env.example .env   # fill in Willys credentials
#   docker compose up -d
#
# NOTE: the willys-adapter build context points at the sibling willys-client
# repo; keep ~/dev/store-clients/willys-client checked out next to ~/dev/spisordning.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: spisordning
      POSTGRES_USER: spisordning
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Apply the schema on first boot.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spisordning']
      interval: 5s
      timeout: 3s
      retries: 10

  willys-adapter:
    build:
      context: ../store-clients/willys-client
      dockerfile: Dockerfile.adapter
    restart: unless-stopped
    environment:
      ADAPTER_PORT: '8402'
      WILLYS_USERNAME: ${WILLYS_USERNAME:?set in .env}
      WILLYS_PASSWORD: ${WILLYS_PASSWORD:?set in .env}
    # Host port 8402 may be occupied by a host-level willys-adapter instance.
    # The Docker-network link (food-brain → willys-adapter:8402) works
    # regardless; uncomment the line below if host-port access is needed.
    # ports:
    #   - '8402:8402'

  food-brain:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # food-brain reads postgres + homelab services from .env; see .env.example.
      DATABASE_URL: postgres://spisordning:${POSTGRES_PASSWORD}@postgres:5432/spisordning?sslmode=disable
      TZ: Europe/Stockholm
      MEALIE_BASE_URL: ${MEALIE_BASE_URL:-http://hlab-mealie:9000}
      MEALIE_API_TOKEN: ${MEALIE_API_TOKEN:-}
      OLLA_OPENAI_BASE_URL: ${OLLA_OPENAI_BASE_URL:-}
      SKOLMATEN_BASE_URL: ${SKOLMATEN_BASE_URL:-}
      ADAPTER_URL: ${ADAPTER_URL:-http://willys-adapter:8402}
    ports:
      - '8080:8080'

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://spisordning:${POSTGRES_PASSWORD}@postgres:5432/spisordning?sslmode=disable
      TZ: Europe/Stockholm
    # Default: Streamable HTTP on :8401 (matching Dockerfile.mcp CMD).
    # For stdio mode (agent subprocess), override: command: ["--stdio"]
    # For a custom port: command: ["--port", "9000"]
    ports:
      - '8401:8401'

volumes:
  pgdata:
